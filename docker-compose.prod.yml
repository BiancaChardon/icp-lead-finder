# Production overrides. Always use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Only Caddy is published (ports 80/443). The frontend, backend, and database
# are reachable only on the internal Docker networks.

services:
  backend:
    ports: !reset []
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to https://<your SITE_ADDRESS>}
      CONTACT_PROVIDER: ${CONTACT_PROVIDER:?Set CONTACT_PROVIDER explicitly (for example "mock")}

  frontend:
    ports: !reset []

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your domain name or the server's public IP}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:
